name: Materialise visual review assets
on:
  push:
    branches:
      - redesign-human-editorial-20261020

permissions:
  actions: read
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download the successful visual QA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39464745563 -n website-qa -D qa-download
          mkdir -p qa-review
          cp -R qa-download/screenshots qa-review/screenshots
      - name: Create the Apple touch icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert favicon.png -resize 180x180 apple-touch-icon.png
          rm .github/workflows/materialise-visual-review.yml
      - name: Commit review images and touch icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-review apple-touch-icon.png .github/workflows/materialise-visual-review.yml
          git commit -m "Add temporary visual review assets"
          git push
