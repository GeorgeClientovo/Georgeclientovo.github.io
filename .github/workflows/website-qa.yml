name: Website QA
on:
  push:
    branches:
      - redesign-human-editorial-20261020

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tools
        run: |
          npm install --no-save playwright @axe-core/playwright lighthouse
          npx playwright install --with-deps chromium
      - name: Start the static site
        run: |
          python3 -m http.server 4173 > /tmp/clientovo-site.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html && break; sleep 1; done
      - name: Browser, link, form and axe checks
        run: node .github/qa/website-qa.mjs
      - name: Lighthouse all pages
        run: |
          mkdir -p qa-artifacts/lighthouse
          for page in index.html how-it-works.html contact.html privacy-and-security.html client-onboarding-checklist.html client-onboarding-forms-vs-managed-service.html 404.html; do
            slug=${page%.html}
            npx lighthouse "http://127.0.0.1:4173/${page}" --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="qa-artifacts/lighthouse/${slug}.json"
          done
          node .github/qa/lighthouse-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-qa
          path: qa-artifacts
