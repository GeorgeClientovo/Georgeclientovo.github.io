name: Materialise website fonts
on:
  push:
    branches:
      - redesign-human-editorial-20261020

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download licensed font subsets
        run: |
          mkdir -p fonts
          curl -fsSL https://raw.githubusercontent.com/fontsource/font-files/main/fonts/google/newsreader/files/newsreader-latin-400-normal.woff2 -o fonts/newsreader-latin-400-normal.woff2
          curl -fsSL https://raw.githubusercontent.com/fontsource/font-files/main/fonts/google/newsreader/files/newsreader-latin-500-normal.woff2 -o fonts/newsreader-latin-500-normal.woff2
          curl -fsSL https://raw.githubusercontent.com/fontsource/font-files/main/fonts/google/newsreader/LICENSE -o fonts/LICENSE-newsreader.txt
          curl -fsSL https://raw.githubusercontent.com/fontsource/font-files/main/fonts/google/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2 -o fonts/ibm-plex-sans-latin-400-normal.woff2
          curl -fsSL https://raw.githubusercontent.com/fontsource/font-files/main/fonts/google/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2 -o fonts/ibm-plex-sans-latin-600-normal.woff2
          curl -fsSL https://raw.githubusercontent.com/fontsource/font-files/main/fonts/google/ibm-plex-sans/LICENSE -o fonts/LICENSE-ibm-plex-sans.txt
          rm .github/workflows/materialise-fonts.yml
      - name: Commit self-hosted fonts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts .github/workflows/materialise-fonts.yml
          git commit -m "Add self-hosted website fonts"
          git push
